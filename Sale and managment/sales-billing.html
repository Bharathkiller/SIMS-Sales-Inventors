<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales &amp; Billing | SIMS</title>
  <link rel="stylesheet" href="style.css?v=20260809-apple-luxury">
  <script src="roles.js" defer></script>
  <script src="auth.js" defer></script>
  <script src="app.js" defer></script>
  <script src="app-refresh.js" defer></script>
</head>
<body data-page="sales" data-access="admin">
  <header class="navbar"><h1 class="logo">Sales &amp; Billing</h1><nav aria-label="Primary navigation"><a href="index.html">Home</a><a href="admin-dashboard.html">Dashboard</a><a href="product-management.html">Products</a><a href="stock-control.html">Stock</a><a href="reports.html">Reports</a></nav></header>
  <main>
    <section class="section reveal" style="--reveal-delay: 60ms;"><div class="section-head reveal" style="--reveal-delay: 100ms;"><div><h2>Create invoice</h2><p class="section-intro">Only products with available stock can be added to an invoice.</p></div></div>
      <div class="card form-card reveal" style="--reveal-delay: 140ms;"><form id="sale-form"><div class="form-grid">
        <label class="form-field full"><span>Product</span><select id="sale-product" required></select></label>
        <label class="form-field"><span>Quantity</span><input id="sale-quantity" type="number" min="1" step="1" required></label>
        <label class="form-field"><span>Unit price</span><input id="sale-price" type="number" readonly aria-label="Unit price"></label>
        <div class="invoice-total full"><span>Invoice total</span><strong id="sale-total">&#8377;0</strong></div>
      </div><div class="form-actions"><button class="btn-primary" type="submit">Generate invoice</button></div></form><div id="invoice-result" class="invoice-result" hidden></div></div>
    </section>
    <section class="section reveal" style="--reveal-delay: 180ms;"><div class="section-head reveal" style="--reveal-delay: 220ms;"><div><h2>Recent sales</h2><p class="section-intro">Invoices created in this browser.</p></div></div><div class="table-wrap reveal" style="--reveal-delay: 260ms;"><table class="table"><thead><tr><th>Invoice ID</th><th>Product</th><th>Quantity</th><th>Total</th><th>Created</th></tr></thead><tbody id="recent-sales-body"></tbody></table></div></section>
  </main>
  <footer><p>&copy; 2026 Sales &amp; Inventory Management System</p></footer>
</body>
</html>
