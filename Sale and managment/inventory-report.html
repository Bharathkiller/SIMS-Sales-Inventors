<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory Report | SIMS</title>
  <link rel="stylesheet" href="style.css?v=20260809-apple-luxury">
  <script src="roles.js" defer></script>
  <script src="auth.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body data-page="inventoryReport" data-access="admin">
  <header class="navbar"><h1 class="logo">Inventory Report</h1><nav aria-label="Primary navigation"><a href="index.html">Home</a><a href="admin-dashboard.html">Dashboard</a><a href="stock-control.html">Stock control</a><a href="reports.html">All reports</a></nav></header>
  <main>
    <section class="section"><div class="section-head"><div><h2>Inventory summary</h2><p class="section-intro">A real-time summary of the current product catalog.</p></div></div><div class="cards">
      <article class="card metric-card"><h3>Total products</h3><p id="inventory-products" class="big-number">0</p></article>
      <article class="card metric-card"><h3>Low-stock items</h3><p id="inventory-low" class="big-number">0</p></article>
      <article class="card metric-card"><h3>Out-of-stock items</h3><p id="inventory-out" class="big-number">0</p></article>
    </div></section>
    <section class="section"><div class="section-head"><div><h2>Product inventory</h2></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Product</th><th>Category</th><th>Stock</th><th>Status</th></tr></thead><tbody id="inventory-report-body"></tbody></table></div></section>
  </main><footer><p>&copy; 2026 Sales &amp; Inventory Management System</p></footer>
</body>
</html>
