<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Management | SIMS</title>
  <link rel="stylesheet" href="style.css?v=20260809-apple-luxury">
  <script src="roles.js" defer></script>
  <script src="auth.js" defer></script>
  <script src="app.js" defer></script>
  <script src="app-refresh.js" defer></script>
</head>
<body data-page="users" data-access="admin">
  <header class="navbar"><h1 class="logo">User Management</h1><nav aria-label="Primary navigation"><a href="index.html">Home</a><a href="admin-dashboard.html">Dashboard</a><a href="product-management.html">Products</a><a href="sales-billing.html">Sales</a><a href="reports.html">Reports</a></nav></header>
  <main>
    <section class="section"><div class="section-head"><div><h2>Users</h2><p class="section-intro">Maintain the users who can access the system.</p></div><button id="add-user" class="btn-primary" type="button">Add user</button></div><div class="cards">
      <article class="card metric-card"><h3>Total users</h3><p id="user-total" class="big-number">0</p></article>
      <article class="card metric-card"><h3>Active users</h3><p id="user-active" class="big-number">0</p></article>
      <article class="card metric-card"><h3>Inactive users</h3><p id="user-inactive" class="big-number">0</p></article>
    </div></section>
    <section class="section"><div class="table-wrap"><table class="table"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Actions</th></tr></thead><tbody id="users-body"></tbody></table></div></section>
  </main>
  <div id="user-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="user-modal-title" hidden><div class="modal-box"><h3 id="user-modal-title">Add user</h3><form id="user-form"><input id="user-id" name="id" type="hidden"><div class="form-grid">
    <label class="form-field"><span>Name</span><input id="user-name" name="name" required maxlength="80" autocomplete="name"></label>
    <label class="form-field"><span>Email</span><input id="user-email" name="email" type="email" required maxlength="120" autocomplete="email"></label>
    <label class="form-field"><span>Role</span><select id="user-role" name="role" required><option value="">Select a role</option><option>Administrator</option><option>Employee</option><option>Customer</option></select></label>
    <label class="check-field"><input id="user-active-input" name="active" type="checkbox" checked> Active user</label>
  </div><div class="form-actions"><button class="btn-secondary" data-close-modal type="button">Cancel</button><button class="btn-primary" type="submit">Save user</button></div></form></div></div>
  <footer><p>&copy; 2026 Sales &amp; Inventory Management System</p></footer>
</body>
</html>
